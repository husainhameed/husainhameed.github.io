<!DOCTYPE html>
<html>
<head>
  <title>RVIS Student Registration Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: white;
      text-align: center;
      padding-top: 100px;
    }
    .box {
      background: #1e293b;
      padding: 40px;
      width: 320px;
      margin: auto;
      border-radius: 10px;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 20px;
      background: #22d3ee;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box" id="loginBox">
  <h2>RVIS Student Registration Portal</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="fakeLogin()">Register</button>
</div>

<script>
function fakeLogin() {
  var user = document.getElementById("username").value;
  var pass = document.getElementById("password").value;

  document.getElementById("loginBox").innerHTML = `
    <h2 style="color:red;">⚠️ PHISHING SIMULATION</h2>
    <p><strong>This is what you just typed:</strong></p>
    <p>Username: <span style="color:#22d3ee;">${user}</span></p>
    <p>Password: <span style="color:#22d3ee;">${pass}</span></p>
    <hr>
    <p>If this were a real phishing site, your password would now belong to a hacker.</p>
    <p><strong>Hackers don't hack computers.</strong></p>
    <p><strong>They hack people.</strong></p>
  `;
}
</script>

</body>
</html>
