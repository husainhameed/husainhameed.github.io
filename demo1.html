<!DOCTYPE html>
<html>
<head>
<title>AI Cyber Attack Simulator</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: monospace;
  overflow: hidden;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 2;
  text-align: center;
  padding-top: 40px;
}

.box {
  width: 750px;
  margin: auto;
}

input {
  padding: 10px;
  font-size: 18px;
  margin: 10px;
  width: 300px;
  text-align: center;
  background: black;
  color: #00ff00;
  border: 1px solid #00ff00;
}

button {
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
  background: #001100;
  color: #00ff00;
  border: 1px solid #00ff00;
}

#terminal {
  margin-top: 20px;
  height: 320px;
  overflow-y: auto;
  border: 1px solid #00ff00;
  padding: 15px;
  text-align: left;
  background: rgba(0,20,0,0.8);
}

.red { color: red; }
.yellow { color: yellow; }
.big { font-size: 22px; }

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">
  <div class="box">
    <h2>⚡ AI SUPERCOMPUTER ATTACK ENGINE ⚡</h2>
    <p>Enter a secret number (1 – 999,999,999)</p>
    <input type="password" id="password">
    <br>
    <button onclick="startAttack()">INITIATE ATTACK</button>

    <div id="terminal"></div>
  </div>
</div>

<script>
/* MATRIX BACKGROUND */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for (let x = 0; x < columns; x++)
  drops[x] = 1;

function draw() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#00ff00";
  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}
setInterval(draw, 33);

/* ATTACK SIMULATION */

let interval;
let secretNumber;

function log(message) {
  const terminal = document.getElementById("terminal");
  terminal.innerHTML += message + "<br>";
  terminal.scrollTop = terminal.scrollHeight;
}

function dramaticDelay(text, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      log(text);
      resolve();
    }, delay);
  });
}

async function startAttack() {
  const input = document.getElementById("password");
  secretNumber = parseInt(input.value);

  if (secretNumber < 1 || secretNumber > 999999999 || isNaN(secretNumber)) {
    alert("Enter a valid number between 1 and 999,999,999");
    return;
  }

  input.style.display = "none";
  document.querySelector("button").style.display = "none";

  await dramaticDelay("Booting AI attack engine...", 500);
  await dramaticDelay("Connecting to global GPU cluster...", 800);
  await dramaticDelay("Allocating 512 virtual GPUs...", 800);
  await dramaticDelay("Attack speed: 7.8 billion guesses/sec", 800);
  await dramaticDelay("<span class='yellow'>Beginning brute force sequence...</span>", 1000);
  log("----------------------------------------");

  let attempt = 1;
  const startTime = new Date().getTime();

  interval = setInterval(() => {

    let step = Math.max(1, Math.floor((secretNumber - attempt) / 35));
    attempt += step;

    log("Trying: " + attempt.toLocaleString());

    if (attempt >= secretNumber) {
      clearInterval(interval);

      const endTime = new Date().getTime();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(2);

      log("----------------------------------------");
      log("<span class='red big'>ACCESS GRANTED</span>");
      log("Secret number cracked: " + secretNumber.toLocaleString());
      log("Time elapsed: " + timeTaken + " seconds");
      log("");
      log("<span class='yellow'>This was ONLY numbers.</span>");
      log("Add letters + uppercase + symbols...");
      log("The combinations explode EXPONENTIALLY.");
      log("");
      log("<span class='red big'>Length beats complexity.</span>");
    }

  }, 35);
}
</script>

</body>
</html>
