<!DOCTYPE html>
<html>
<head>
  <title>Guessing Attack Demo</title>
  <style>
    body {
      font-family: monospace;
      background-color: black;
      color: #00ff00;
      text-align: center;
      padding-top: 60px;
    }
    .box {
      width: 500px;
      margin: auto;
    }
    input {
      padding: 10px;
      font-size: 18px;
      margin: 10px;
      width: 200px;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #terminal {
      margin-top: 20px;
      height: 250px;
      overflow-y: auto;
      border: 1px solid #00ff00;
      padding: 10px;
      text-align: left;
      background: #001100;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Brute Force Simulator (1–1000)</h2>
  <p>Enter a number between 1 and 1000</p>
  <input type="number" id="password" min="1" max="1000">
  <br>
  <button onclick="startAttack()">Start Attack</button>

  <div id="terminal"></div>
</div>

<script>
let interval;

function startAttack() {
  const pass = parseInt(document.getElementById("password").value);
  const terminal = document.getElementById("terminal");

  if (pass < 1 || pass > 1000 || isNaN(pass)) {
    alert("Please enter a number between 1 and 1000.");
    return;
  }

  terminal.innerHTML = "";
  let attempt = 1;
  const startTime = new Date().getTime();

  interval = setInterval(() => {
    terminal.innerHTML += "Trying: " + attempt + "<br>";
    terminal.scrollTop = terminal.scrollHeight;

    if (attempt === pass) {
      clearInterval(interval);
      const endTime = new Date().getTime();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(2);

      terminal.innerHTML += "<br><span style='color:red;'>ACCESS GRANTED</span><br>";
      terminal.innerHTML += "Password found in " + attempt + " attempts<br>";
      terminal.innerHTML += "Time taken: " + timeTaken + " seconds<br>";
      terminal.innerHTML += "<br><strong>Now imagine 1 to 1,000,000...</strong>";
    }

    attempt++;

    if (attempt > 1000) {
      clearInterval(interval);
    }

  }, 5); // speed (lower number = faster)
}
</script>

</body>
</html>
