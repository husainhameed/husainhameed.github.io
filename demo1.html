<!DOCTYPE html>
<html>
<head>
  <title>Brute Force Simulator</title>
  <style>
    body {
      font-family: monospace;
      background-color: black;
      color: #00ff00;
      text-align: center;
      padding-top: 50px;
    }
    .box {
      width: 600px;
      margin: auto;
    }
    input {
      padding: 10px;
      font-size: 18px;
      margin: 10px;
      width: 300px;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #terminal {
      margin-top: 20px;
      height: 250px;
      overflow-y: auto;
      border: 1px solid #00ff00;
      padding: 10px;
      text-align: left;
      background: #001100;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Brute Force Attack Simulator</h2>
  <p>Choose a secret number between 1 and 999,999,999</p>
  <input type="password" id="password" placeholder="Enter secret number">
  <br>
  <button onclick="startAttack()">Start Attack</button>

  <div id="terminal"></div>
</div>

<script>
let interval;
let secretNumber;

function startAttack() {
  const input = document.getElementById("password");
  secretNumber = parseInt(input.value);

  if (secretNumber < 1 || secretNumber > 999999999 || isNaN(secretNumber)) {
    alert("Enter a number between 1 and 999,999,999");
    return;
  }

  // Hide input field after submission
  input.value = "";
  input.style.display = "none";

  const terminal = document.getElementById("terminal");
  terminal.innerHTML = "";

  let attempt = 1;
  const startTime = new Date().getTime();

  interval = setInterval(() => {

    // Smart stepping (to avoid freezing browser)
    let step = Math.max(1, Math.floor((secretNumber - attempt) / 25));
    attempt += step;

    terminal.innerHTML += "Trying: " + attempt.toLocaleString() + "<br>";
    terminal.scrollTop = terminal.scrollHeight;

    if (attempt >= secretNumber) {
      clearInterval(interval);

      const endTime = new Date().getTime();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(2);

      terminal.innerHTML += "<br><span style='color:red;'>ACCESS GRANTED</span><br>";
      terminal.innerHTML += "Secret number was: " + secretNumber.toLocaleString() + "<br>";
      terminal.innerHTML += "Time taken: " + timeTaken + " seconds<br><br>";
      terminal.innerHTML += "<strong>This is only numbers.</strong><br>";
      terminal.innerHTML += "Real passwords with letters + symbols are exponentially harder.";
    }

  }, 40);
}
</script>

</body>
</html>
