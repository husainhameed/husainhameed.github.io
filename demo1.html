<!DOCTYPE html>
<html>
<head>
  <title>Massive Brute Force Simulator</title>
  <style>
    body {
      font-family: monospace;
      background-color: black;
      color: #00ff00;
      text-align: center;
      padding-top: 50px;
    }
    .box {
      width: 600px;
      margin: auto;
    }
    input {
      padding: 10px;
      font-size: 18px;
      margin: 10px;
      width: 300px;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #terminal {
      margin-top: 20px;
      height: 250px;
      overflow-y: auto;
      border: 1px solid #00ff00;
      padding: 10px;
      text-align: left;
      background: #001100;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Brute Force Attack Simulator (1 – 999,999,999)</h2>
  <p>Enter a number between 1 and 999,999,999</p>
  <input type="number" id="password" min="1" max="999999999">
  <br>
  <button onclick="startAttack()">Start Attack</button>

  <div id="terminal"></div>
</div>

<script>
let interval;

function startAttack() {
  const pass = parseInt(document.getElementById("password").value);
  const terminal = document.getElementById("terminal");

  if (pass < 1 || pass > 999999999 || isNaN(pass)) {
    alert("Enter a number between 1 and 999,999,999");
    return;
  }

  terminal.innerHTML = "";
  let attempt = 1;
  const startTime = new Date().getTime();

  interval = setInterval(() => {

    // Skip faster if far away
    let step = Math.max(1, Math.floor((pass - attempt) / 20));
    attempt += step;

    terminal.innerHTML += "Trying: " + attempt.toLocaleString() + "<br>";
    terminal.scrollTop = terminal.scrollHeight;

    if (attempt >= pass) {
      clearInterval(interval);

      const endTime = new Date().getTime();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(2);

      terminal.innerHTML += "<br><span style='color:red;'>ACCESS GRANTED</span><br>";
      terminal.innerHTML += "Password found at: " + pass.toLocaleString() + "<br>";
      terminal.innerHTML += "Time taken: " + timeTaken + " seconds<br><br>";

      terminal.innerHTML += "<strong>This was only numbers.</strong><br>";
      terminal.innerHTML += "Imagine adding letters + symbols...<br>";
      terminal.innerHTML += "The combinations explode exponentially.";
    }

  }, 30);
}
</script>

</body>
</html>
