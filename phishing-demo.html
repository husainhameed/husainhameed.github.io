<!DOCTYPE html>
<html>
<head>
  <title>School Portal Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: white;
      text-align: center;
      padding-top: 100px;
    }
    .box {
      background: #1e293b;
      padding: 40px;
      width: 300px;
      margin: auto;
      border-radius: 10px;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 20px;
      background: #22d3ee;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box" id="loginBox">
  <h2>RVIS Student Portal</h2>
  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">
  <button onclick="fakeLogin()">Login</button>
</div>

<script>
function fakeLogin() {
  document.getElementById("loginBox").innerHTML = `
    <h2 style="color:red;">⚠️ This Was a Phishing Simulation</h2>
    <p>If this were a real phishing site, your password would now be stolen.</p>
    <p>Hackers don’t need to hack computers.</p>
    <p><strong>They just need you to type your password.</strong></p>
  `;
}
</script>

</body>
</html>
